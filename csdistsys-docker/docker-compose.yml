services:
 web:
   build: .
   ports:
     - "8080:80"
   volumes:
     - ./:/var/www/html
   environment:
    DB_HOST: db
    DB_NAME: csdistsys_db
    DB_USER: csdistsys_user
    DB_PASS: Mypro123

   depends_on:
     - db
 db:
   image: mysql:8.0
   environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: csdistsys_db
      MYSQL_USER: csdistsys_user
      MYSQL_PASSWORD: Mypro123
   volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:



