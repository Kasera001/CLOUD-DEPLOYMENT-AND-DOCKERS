services:
 web:
   build: .
   ports:
     - "8080:80"
   volumes:
     - ./:/var/www/html
   environment:
    DB_HOST: db
    DB_NAME: ${DB_NAME}
    DB_USER: ${DB_USER}
    DB_PASS: ${DB_PASSWORD}

   depends_on:
     - db
 db:
   image: mysql:8.0
   environment:
    MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    MYSQL_DATABASE: ${DB_NAME}
    MYSQL_USER: ${DB_USER}
    MYSQL_PASSWORD: ${DB_PASSWORD}  
   volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:



